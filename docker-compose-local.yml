networks:
  lims_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  caddy_data:
  caddy_config:

services:
  db:
    image: postgres:15
    container_name: aquacheck_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lims_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lims_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lims_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lims_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lims_user} -d ${POSTGRES_DB:-lims_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquacheck_migrations
    command: alembic upgrade head
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lims_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquacheck_backend
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./docs:/app/docs_source:ro              # read-only source for initial content import
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - lims_network

